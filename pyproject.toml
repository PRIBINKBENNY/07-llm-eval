[project]
name = "llmeval"
version = "0.1.0"
description = "Eval harness for LLM apps: rule + LLM-as-judge scorers, regression gate, tracing, HTML reports."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "openai>=1.40", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
llmeval = "llmeval.cli:main"

[tool.setuptools]
packages = ["llmeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
