# Copy into your LLM app's repo as .github/workflows/eval-gate.yml
# Blocks a merge when a prompt/model change makes previously-passing cases fail.
name: eval-gate
on: [pull_request]
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install git+https://github.com/PRIBINKBENNY/07-llm-eval
      - run: llmeval run evals/suite.yaml --out runs/pr.json --html
        env:
          LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - run: llmeval compare evals/baseline.json runs/pr.json   # exit 1 on regression
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: eval-report, path: runs/pr.html}
